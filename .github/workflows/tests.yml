name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  # Same suite through uv, so both install paths stay tested.
  uv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -t . -v
      # requirements.txt must be the export of uv.lock.
      - run: uv export --no-hashes --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt && diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)
